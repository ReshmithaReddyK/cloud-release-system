<!DOCTYPE html>
<html>
<head>
    <title>Cloud Release Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Cloud Release Management System</h1>
    <p>Automated Software Release and Version Tracking</p>
</header>

<div class="container">

     <div class="actions">

        <button>+ New Version</button>
        <button>+ New Release</button>
        <button>View History</button>

    </div>

    <div class="cards">

        <div class="card">
            <h3>Projects</h3>
            <p id="projects">2</p>
        </div>

        <div class="card">
            <h3>Versions</h3>
            <p id="versions">8</p>
        </div>

        <div class="card">
            <h3>Successful Releases</h3>
            <p id="successful">6</p>
        </div>

        <div class="card">
            <h3>Failed Releases</h3>
            <p id="failed">2</p>
        </div>

    </div>

    <h2>Release History</h2>

    <table>

        <thead>
            <tr>
                <th>Release ID</th>
                <th>Version</th>
                <th>Build</th>
                <th>Test</th>
                <th>Deployment</th>
            </tr>
        </thead>

        <tbody id="releaseTable">

        </tbody>

    </table>

</div>

<script src="app.js"></script>

</body>
</html>
